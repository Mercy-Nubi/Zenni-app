name: Tidy up files (runs once)

on:
  push:
    paths:
      - ".github/workflows/tidy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move images and index.html into the right folders
        run: |
          set -e
          mkdir -p docs/images public/images
          # Collect every image from the top level and both image folders.
          for f in *.jpg docs/images/*.jpg public/images/*.jpg; do
            [ -f "$f" ] || continue
            n=$(basename "$f")
            [ -f "docs/images/$n" ] || cp "$f" "docs/images/$n"
            [ -f "public/images/$n" ] || cp "$f" "public/images/$n"
          done
          rm -f ./*.jpg
          # The built index.html belongs in docs/.
          if grep -q "assets/index-" index.html; then
            mv index.html docs/index.html
          fi
          # Restore the source index.html at the top level.
          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <meta name="theme-color" content="#0B4A4D" />
              <title>Zenni App Redesign · Mercy Nubi</title>
              <link rel="preconnect" href="https://fonts.googleapis.com" />
              <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" />
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.tsx"></script>
            </body>
          </html>
          HTML
          sed -i 's/^          //' index.html
          # This script only needs to run once.
          rm -f .github/workflows/tidy.yml

      - name: Save the changes
        run: |
          git config user.name "Mercy-Nubi"
          git config user.email "Mercy-Nubi@users.noreply.github.com"
          git add -A
          git commit -m "Move images and index.html into docs/ and public/" || echo "Nothing to change"
          git push
